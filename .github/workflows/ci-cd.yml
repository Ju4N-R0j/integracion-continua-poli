name: CI/CD - INTEGRACION CONTINUA POLI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: instalar dependencias
        run: npm install

      - name: Validar Version de Docker
        run: docker --version

      - name: construir imagen de Docker
        run: docker build -t integracion-api-jenkins:latest .
        
      - name: levantar contenedor de Docker
        run: docker compose up -d

      - name: esperar servicios
        run: sleep 25

      - name: probar endpoint principal
        run: curl --fail http://localhost:3000

      - name: probar endpoint health
        run: curl --fail http://localhost:3000/health
        
      - name: probar endpoint task
        run: curl --fail http://localhost:3000/tasks

      - name: probar endpoint health
        run: curl --fail http://localhost:3000/health 
        
      - name: detener contenedor de Docker
        if: always()
        run: docker compose down